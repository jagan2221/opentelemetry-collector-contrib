receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # PTR: IP address → hostname
  lookup/ptr:
    source:
      type: dns
      record_type: PTR
      timeout: 5s
      cache:
        enabled: false
    lookups:
      - key: log.attributes["client.ip"]
        attributes:
          - destination: client.hostname
            default: "unresolved"

  # A: hostname → IPv4 address
  lookup/a:
    source:
      type: dns
      record_type: A
      timeout: 5s
      cache:
        enabled: false
    lookups:
      - key: log.attributes["target.hostname"]
        attributes:
          - destination: target.ipv4
            default: "unresolved"

  # AAAA: hostname → IPv6 address
  lookup/aaaa:
    source:
      type: dns
      record_type: AAAA
      timeout: 5s
      cache:
        enabled: false
    lookups:
      - key: log.attributes["target.hostname"]
        attributes:
          - destination: target.ipv6
            default: "unresolved"

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
  pipelines:
    logs:
      receivers: [otlp]
      processors: [lookup/ptr, lookup/a, lookup/aaaa]
      exporters: [debug]
